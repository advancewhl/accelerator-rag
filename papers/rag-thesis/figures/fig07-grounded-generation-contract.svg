   <g id="text_1">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="75.770079" y="48.094275" transform="rotate(-0 75.770079 48.094275)">Requirement extraction</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(49.508922 61.419547)">Original query only</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(41.805696 69.69691)">1-6 factual requirements</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="255.11811" y="48.094275" transform="rotate(-0 255.11811 48.094275)">Evidence selection</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(230.956626 61.419547)">Top-5 full parents</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(222.554001 69.69691)">Request-local span IDs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="434.466142" y="48.094275" transform="rotate(-0 434.466142 48.094275)">Claim synthesis</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(400.674025 61.419547)">Supported requirements</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(408.026321 69.69691)">Verified spans only</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="434.466142" y="137.332803" transform="rotate(-0 434.466142 137.332803)">Claim and coverage review</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(385.441314 152.618779)">Subject, condition, number, version</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(391.214181 161.518759)">One bounded rewrite if needed</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="255.11811" y="137.332803" transform="rotate(-0 255.11811 137.332803)">Deterministic checks</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(206.620907 152.618779)">IDs, bindings, numeric provenance</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(218.001759 160.896142)">Reject unsupported claims</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="75.770079" y="137.332803" transform="rotate(-0 75.770079 137.332803)">Code-computed status</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(37.425227 152.618779)">All / some / none supported</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(33.458688 160.896142)">answered / partial / insufficient</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #24292e" x="165.444094" y="228.744003" transform="rotate(-0 165.444094 228.744003)">Source resolution and original PDF</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(70.366759 244.029979)">Map span to canonical parent, document, version and physical page</text>
    <text style="font-size: 6.3px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(72.999469 252.307342)">The model does not generate filesystem paths or citation identities</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.5px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(371.451969 213.988451)">Semantic review is model-based.</text>
    <text style="font-size: 6.5px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(371.451969 224.358617)">Valid IDs and numbers do not</text>
    <text style="font-size: 6.5px; font-family: 'Liberation Sans'; fill: #24292e" transform="translate(371.451969 234.0864)">prove factual completeness.</text>
   </g>
  </g>
