[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerator-rag"
version = "0.1.0"
description = "RAG prototype for accelerator documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jieba>=0.42.1",
    "numpy>=1.26",
    "sentence-transformers>=5,<6",
    "qdrant-client==1.18.0",
    "pymupdf>=1.24,<2",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
accelerator-rag = "accelerator_rag.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"accelerator_rag.rag" = ["web/*", "web/katex/*", "web/katex/contrib/*", "web/katex/fonts/*", "web/markdown/*", "web/pdfjs/*", "web/pdfjs/build/*", "web/pdfjs/cmaps/*", "web/pdfjs/standard_fonts/*", "web/pdfjs/wasm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
